# coturn yapılandırması — aWay relay
#
# ÖNEMLİ: static-auth-secret değerini güçlü rastgele bir değerle DEĞİŞTİR ve
# sunucunun AWAY_TURN_SECRET ortam değişkenine AYNI değeri ver.
#   openssl rand -hex 32   # yeni gizli anahtar üret

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# VDS'in public IP'si. VDS'in IP'si değişirse burayı güncelle.
external-ip=38.210.77.34

# Kısa ömürlü kimlik doğrulama (REST / use-auth-secret). Sunucu HMAC ile geçici
# kullanıcı/parola üretir; coturn burada doğrular.
use-auth-secret
static-auth-secret=161b82fc050b7d5462b3b58e3eb3df9d7f83aeca12c8913e03241fff65192426

realm=away.bilgicoderteam.tr
server-name=away.bilgicoderteam.tr

# Relay için UDP port aralığı (firewall'da bu aralığı da aç).
min-port=49160
max-port=49200

# Güvenlik: gereksiz özellikleri kapat
no-cli
no-tcp-relay
no-multicast-peers
# Özel/iç IP'lere relay'i engelle (SSRF benzeri kötüye kullanımı azaltır)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# TLS (turns://) kullanmak istersen certbot sertifikalarını bağlayıp aç:
# cert=/certs/fullchain.pem
# pkey=/certs/privkey.pem

fingerprint
stale-nonce=600
