# aWay sinyal sunucusu için nginx reverse proxy (TLS sonlandırma).
#
# Bu dosyayı /etc/nginx/sites-available/ altına koyup sites-enabled'a symlink at,
# sonra `nginx -t && systemctl reload nginx`.
#
# TLS sertifikası için (certbot zaten kuruluysa):
#   certbot --nginx -d away.bilgicoderteam.tr
#
# Alt alan adı away.bilgicoderteam.tr, VDS IP'sine (38.210.77.34) A kaydı ile yönlenmeli.

server {
    listen 80;
    listen [::]:80;
    server_name away.bilgicoderteam.tr;
    # certbot HTTP-01 doğrulaması / HTTPS'e yönlendirme
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name away.bilgicoderteam.tr;

    # certbot bu satırları otomatik ekler:
    # ssl_certificate     /etc/letsencrypt/live/away.bilgicoderteam.tr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/away.bilgicoderteam.tr/privkey.pem;

    # WebSocket sinyal uç noktası
    location /ws {
        proxy_pass http://127.0.0.1:9000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebRTC sinyal bağlantısı uzun süre açık kalır
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:9000/healthz;
    }
}
