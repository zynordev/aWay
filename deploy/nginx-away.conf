# away.bilgicoderteam.tr — aWay: (1) kaynak indirme (static)  (2) sinyal sunucusu /ws proxy
# Cloudflare arkasında. Mevcut think/place/Mastodon bloklarına dokunmaz.

server {
    listen 80;
    listen [::]:80;
    server_name away.bilgicoderteam.tr;

    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }

    root /var/www/away;
    autoindex off;
    location / { try_files $uri =404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name away.bilgicoderteam.tr;

    ssl_certificate     /etc/letsencrypt/live/away.bilgicoderteam.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/away.bilgicoderteam.tr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }

    # WebSocket sinyal uç noktası -> away-server (localhost)
    location /ws {
        proxy_pass http://127.0.0.1:9000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz { proxy_pass http://127.0.0.1:9000/healthz; }

    # Kaynak indirme (static)
    root /var/www/away;
    autoindex off;

    # İndirilebilir yapılar sürekli güncelleniyor; Cloudflare bunları 4 saat
    # önbellekte tutup eski exe'yi dağıtıyordu. Önbelleklemeyi kapat.
    location ~ ^/(away\.exe|aWay-kaynak\.zip)$ {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / { try_files $uri =404; }
}
