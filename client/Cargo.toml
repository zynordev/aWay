[package]
name = "away-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# Katmanlar:
#   * Çekirdek (varsayılan): sinyal + WebRTC taşıma (data channel). Hafif; VDS'te de derlenir.
#   * `media` feature: ekran yakalama (scrap/DXGI), H264 encode/decode (openh264), video
#     track ve egui/wgpu izleyici penceresi. Ağır C/C++ bağımlılıkları içerir; bellek-darı
#     VDS'te DERLENMEZ — Windows/Linux geliştirme makinesinde `--features media` ile derlenir.

[features]
default = []
media = ["dep:scrap", "dep:openh264", "dep:bytes", "dep:eframe", "dep:egui", "dep:enigo"]

[dependencies]
anyhow.workspace = true
away-shared = { path = "../shared" }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3.33"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# wss:// (production) için TLS: rustls + OS kök sertifikaları (Windows'ta OpenSSL gerektirmez).
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
webrtc = "0.17.2"

# --- media feature (opsiyonel, ağır) ---
scrap = { version = "0.5", optional = true }
openh264 = { version = "0.6", optional = true }
bytes = { version = "1", optional = true }
eframe = { version = "0.28", optional = true }
egui = { version = "0.28", optional = true }
# Uzaktan giriş enjeksiyonu (Windows SendInput / Linux X11 XTest).
# Linux'ta derlemek için libxkbcommon-dev gerekir; Windows'ta ek bağımlılık yok.
enigo = { version = "0.6", optional = true }
