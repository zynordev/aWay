# aWay — AnyDesk benzeri uzaktan masaüstü aracı (workspace kökü)
#
# Üyeler:
#   shared/  -> sunucu ve istemcinin ortak konuştuğu signaling protokol tipleri
#   server/  -> VDS'te çalışan sinyal (buluşturma/relay-signaling) sunucusu
#   client/  -> Windows/Linux native istemci (ekran/giriş/ses) — ağır bağımlılıklar M2'de eklenecek
#
# NOT: `client` şu an bilinçli olarak hafif tutuldu (webrtc-rs vb. yok) ki bellek-darı
# VDS'te tüm workspace derlenirken Mastodon/r-place servisleri etkilenmesin. Ağır medya
# bağımlılıkları M2'de, istemci geliştirme/test makinesinde eklenecek.

[workspace]
resolver = "2"
members = ["shared", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BilgiCoder Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
